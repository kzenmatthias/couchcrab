<!doctype html>
<html lang="%paraglide.lang%" dir="%paraglide.dir%" data-theme="%couchcrab.theme%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			// Runs before first paint so a dismissed first-visit notice never flashes.
			try {
				if (localStorage.getItem('couchcrab:notice-dismissed') === '1')
					document.documentElement.dataset.notice = 'dismissed';
			} catch {
				/* storage unavailable: keep showing the notice */
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
