<!doctype html>
<html lang="%paraglide.lang%" dir="%paraglide.dir%" data-theme="%couchcrab.theme%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			// Runs before first paint so a dismissed first-visit notice never flashes.
			try {
				if (localStorage.getItem('couchcrab:notice-dismissed') === '1')
					document.documentElement.dataset.notice = 'dismissed';
			} catch {
				/* storage unavailable: keep showing the notice */
			}
			// Display settings (src/lib/prefs/display.ts) before first paint, so text size,
			// motion and link underlines never flash.
			try {
				var d = JSON.parse(localStorage.getItem('couchcrab:prefs') || '{}').display || {};
				var r = document.documentElement.dataset;
				if (d.textSize === 'large' || d.textSize === 'larger') r.textSize = d.textSize;
				if (d.motion === 'reduce' || d.motion === 'allow') r.motion = d.motion;
				if (d.underlineLinks === true) r.underlineLinks = 'on';
				if (d.textOnly === true) r.textOnly = 'on';
			} catch {
				/* storage unavailable or broken: defaults */
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
