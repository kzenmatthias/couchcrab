<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Couchcrab · design board v4</title>
<style>
/* ---------- themes ---------- */
:root,[data-theme=dark]{
  --board:#030a0e; --bg:#07131a; --surface:#132b36; --surface2:#0f232c; --line:#3a5a68;
  --text:#eef5f7; --muted:#b3c6cd; --accent:#ff7a59; --on-accent:#1b0c07; --accent-text:#ffb39e;
  --sea-text:#9ff1ec; --sand:#f3d9a4; --focus:#ffe08a; --ghost:#ffffff14; --ghost-line:#ffffff4d;
  --sw-off:#5b7a87; --sw-on:#3fd0c9; --sw-knob:#06292b;
  --hero:linear-gradient(90deg,#07131a 25%,#07131a00 70%),radial-gradient(900px 400px at 75% 30%,#1f6f7a 0%,transparent 60%),radial-gradient(700px 380px at 95% 80%,#ff7a5955 0%,transparent 60%),linear-gradient(160deg,#0f3340,#07131a 70%);
  --h-green:linear-gradient(90deg,#07131a 25%,#07131a0 70%),radial-gradient(800px 360px at 80% 20%,#3a7d44aa,transparent 60%),linear-gradient(170deg,#173a2a,#07131a 75%);
  --h-red:linear-gradient(90deg,#07131a 25%,#07131a0 70%),radial-gradient(800px 360px at 80% 20%,#a3333399,transparent 60%),linear-gradient(170deg,#3a1218,#07131a 75%);
  --h-purple:linear-gradient(90deg,#07131a 25%,#07131a0 70%),radial-gradient(700px 320px at 20% 0%,#7b5cff55,transparent 60%),linear-gradient(170deg,#1b1f3d,#07131a 75%);
}
[data-theme=light]{
  --board:#d9d4cc; --bg:#faf7f2; --surface:#ffffff; --surface2:#f1ece4; --line:#8f857a;
  --text:#13232b; --muted:#44545b; --accent:#b93a14; --on-accent:#ffffff; --accent-text:#9a2f0f;
  --sea-text:#0a5e5a; --sand:#6e4f0c; --focus:#0b57d0; --ghost:#13232b0d; --ghost-line:#13232b59;
  --sw-off:#7d8b91; --sw-on:#0a7a74; --sw-knob:#ffffff;
  --hero:linear-gradient(90deg,#faf7f2 25%,#faf7f200 70%),radial-gradient(900px 400px at 75% 30%,#b9e6e2 0%,transparent 60%),radial-gradient(700px 380px at 95% 80%,#ffd2c2 0%,transparent 60%),linear-gradient(160deg,#e6f1f0,#faf7f2 70%);
  --h-green:linear-gradient(90deg,#faf7f2 25%,#faf7f20 70%),radial-gradient(800px 360px at 80% 20%,#cfe8cf,transparent 60%),linear-gradient(170deg,#e7f2e6,#faf7f2 75%);
  --h-red:linear-gradient(90deg,#faf7f2 25%,#faf7f20 70%),radial-gradient(800px 360px at 80% 20%,#f6cfcf,transparent 60%),linear-gradient(170deg,#f6e4e4,#faf7f2 75%);
  --h-purple:linear-gradient(90deg,#faf7f2 25%,#faf7f20 70%),radial-gradient(700px 320px at 20% 0%,#ddd5ff,transparent 60%),linear-gradient(170deg,#ece9fb,#faf7f2 75%);
}
[data-theme=contrast]{
  --board:#000; --bg:#000; --surface:#000; --surface2:#000; --line:#fff;
  --text:#fff; --muted:#fff; --accent:#ffd400; --on-accent:#000; --accent-text:#ffd400;
  --sea-text:#7ffcff; --sand:#ffd400; --focus:#00e5ff; --ghost:transparent; --ghost-line:#fff;
  --sw-off:#fff; --sw-on:#ffd400; --sw-knob:#000;
  --hero:#000; --h-green:#000; --h-red:#000; --h-purple:#000;
}
[data-size=large]{font-size:112.5%}
[data-size=larger]{font-size:125%}

/* ---------- base ---------- */
*{box-sizing:border-box}
html{font-size:100%}
body{margin:0;background:var(--board);color:var(--text);font:0.9375rem/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:inherit;text-underline-offset:.15em}
[data-links=underline] .app a{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
ul.plain{list-style:none;margin:0;padding:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
[data-motion=reduce] *{transition:none!important;animation:none!important}

/* ---------- design-board chrome ---------- */
.board-nav{position:sticky;top:0;z-index:50;display:flex;gap:8px 14px;flex-wrap:wrap;align-items:center;padding:10px 16px;background:var(--board);border-bottom:1px solid var(--line)}
.board-nav .ttl{font-weight:700;color:var(--accent-text)}
.board-nav ul{display:flex;gap:6px;flex-wrap:wrap;list-style:none;margin:0;padding:0}
.board-nav button{background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.8125rem;min-height:32px}
.board-nav button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.board-nav fieldset{border:0;margin:0 0 0 auto;padding:0;display:flex;gap:6px;align-items:center;font-size:.8125rem}
.board-nav legend{float:left;margin-right:6px;color:var(--muted)}
.board-nav label{border:1px solid var(--line);border-radius:999px;padding:5px 10px;cursor:pointer}
.board-nav label:has(input:checked){background:var(--text);color:var(--bg);font-weight:700}
.board-nav input{position:absolute;opacity:0}
.board-nav label:has(input:focus-visible){outline:3px solid var(--focus);outline-offset:2px}
.screen{padding:24px 16px 60px}
.screen[hidden]{display:none}
.note{max-width:1280px;margin:0 auto 16px;background:var(--surface2);border:1px dashed var(--line);border-radius:12px;padding:12px 16px;color:var(--muted);font-size:.875rem}
.note strong{color:var(--text)}
.note ul{margin:6px 0 0;padding-left:18px}

/* ---------- app frame ---------- */
.app{max-width:1280px;margin:0 auto;background:var(--bg);border-radius:18px;overflow:hidden;border:1px solid var(--line);position:relative}
.skip{position:absolute;left:12px;top:-60px;z-index:10;background:var(--accent);color:var(--on-accent);padding:10px 14px;border-radius:8px;font-weight:700;text-decoration:none}
.skip:focus{top:12px}
.top{display:flex;align-items:center;gap:10px 22px;padding:14px 28px;flex-wrap:wrap;position:relative;z-index:2}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1.25rem;letter-spacing:-.02em;text-decoration:none}
.shell{width:26px;height:26px;border-radius:50% 50% 45% 55%;background:conic-gradient(from 200deg,#ff7a59,#f3d9a4,#ff7a59);flex:0 0 auto}
.unofficial{font-size:.6875rem;letter-spacing:.06em;text-transform:uppercase;color:var(--sand);border:1px solid var(--sand);border-radius:6px;padding:2px 6px;font-weight:700}
.top nav ul{display:flex;gap:4px 16px;flex-wrap:wrap;list-style:none;margin:0;padding:0}
.top nav a{text-decoration:none;color:var(--muted);display:inline-block;padding:6px 2px;font-size:.875rem}
.top nav a[aria-current=page]{color:var(--text);font-weight:700;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:6px}
.top .sp{flex:1}
.search input{background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:7px 14px;width:240px;font-size:.8125rem}
.search input::placeholder{color:var(--muted);opacity:1}
.me{width:40px;height:40px;border-radius:50%;background:#5865f2;color:#fff;border:2px solid var(--line);font-size:.75rem;font-weight:800}
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:48px;width:300px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:0 20px 50px #0007;z-index:5}
.menu h2{font-size:.8125rem;margin:4px 6px 8px;color:var(--muted);font-weight:600}
.menu a{display:block;padding:9px 8px;border-radius:8px;text-decoration:none}
.menu a:hover{background:var(--ghost)}
.menu hr{border:0;border-top:1px solid var(--line);margin:8px 0}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;border:0;margin:0;padding:0}
.seg legend{font-size:.8125rem;color:var(--muted);margin:0 6px 6px;padding:0}
.seg label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.8125rem;cursor:pointer;min-height:40px}
.seg label:has(input:checked){background:var(--text);color:var(--bg);font-weight:700}
.seg input{accent-color:var(--accent);margin:0}

.hero{position:relative;margin-top:-68px;padding:120px 28px 40px;min-height:400px;background:var(--hero)}
.hero h1{font-size:2.875rem;line-height:1.05;margin:10px 0;letter-spacing:-.03em;max-width:640px}
.hero p{color:var(--muted);max-width:540px;margin:0 0 18px}
.kicker{color:var(--sea-text);font-weight:700;font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;margin:0}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid transparent;border-radius:10px;padding:11px 18px;font-weight:700;min-height:44px;text-decoration:none}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:var(--ghost);border-color:var(--ghost-line)}
.btn.sm{padding:6px 12px;font-size:.8125rem;border-radius:8px;min-height:36px}
.btns{display:flex;gap:8px;flex-wrap:wrap}

.banner{margin:0 28px 6px;background:var(--surface2);border:1px solid var(--sand);border-radius:12px;padding:10px 14px;font-size:.8125rem;display:flex;gap:12px;align-items:center}
.banner p{margin:0}
.banner .x{margin-left:auto;background:none;border:1px solid var(--ghost-line);border-radius:8px;min-width:36px;min-height:36px}

/* rails */
.row{padding:8px 28px 18px}
.row-h{display:flex;align-items:center;gap:10px}
.row h2{font-size:1.125rem;margin:14px 0 10px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.row h2 small{color:var(--muted);font-weight:400;font-size:.8125rem}
.rail-btns{margin-left:auto;display:flex;gap:6px}
.rail-btns button{width:36px;height:36px;border-radius:50%;background:var(--surface2);border:1px solid var(--line);font-size:1.1rem;line-height:1}
.rail{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 4px 10px;margin:-4px -4px 0;list-style:none;scrollbar-width:thin}
.rail>li{scroll-snap-align:start;flex:0 0 auto}

/* episode card */
.ep{display:block;width:240px;text-decoration:none;border-radius:12px;padding:0 0 4px}
.ep:hover .t{text-decoration:underline}
.thumb{position:relative;display:block;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:var(--g)}
.thumb::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,#000c)}
.thumb .lbl{position:absolute;left:10px;bottom:8px;font-weight:800;font-size:1.25rem;color:#fff;letter-spacing:-.02em}
.thumb .dur{position:absolute;right:8px;bottom:8px;background:#000;color:#fff;font-size:.75rem;padding:2px 6px;border-radius:4px}
.thumb .prog{position:absolute;left:0;bottom:0;height:5px;background:#ff7a59;box-shadow:0 -1px 0 #000}
.thumb.spoil{background:repeating-linear-gradient(135deg,#1d3440 0 12px,#183039 12px 24px)}
.thumb.spoil::before{background:none}
.ep .t{display:block;margin-top:7px;font-size:.875rem;font-weight:700}
.ep .m{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:.8125rem;color:var(--muted);margin-top:2px}
.badge{font-size:.75rem;border:1px solid var(--ghost-line);border-radius:6px;padding:0 6px;color:var(--text)}
.badge.prog{border-color:var(--accent-text);color:var(--accent-text)}
.cc{font-size:.6875rem;font-weight:800;border:1.5px solid var(--text);color:var(--text);border-radius:4px;padding:0 4px;line-height:1.4}
.av{width:22px;height:22px;border-radius:50%;background:var(--c);display:inline-grid;place-items:center;font-size:.6rem;font-weight:800;color:#0a0a0a;flex:0 0 auto}
.av.md{width:40px;height:40px;font-size:.8125rem}
.av.xl{width:88px;height:88px;font-size:1.5rem}
.av.xxl{width:120px;height:120px;font-size:2.1rem}

.poster{display:flex;flex-direction:column;justify-content:flex-end;width:200px;aspect-ratio:2/3;border-radius:12px;padding:14px;background:var(--g);position:relative;overflow:hidden;color:#fff;text-decoration:none}
.poster::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,#000d)}
.poster>*{position:relative}
.poster b{font-size:1.3rem;line-height:1.1}
.poster span{font-size:.8125rem}
.poster .tag{position:absolute;top:10px;left:10px;background:#000;border-radius:5px;padding:2px 6px;text-transform:uppercase;letter-spacing:.06em;font-size:.6875rem;font-weight:700}

.creator{display:flex;flex-direction:column;align-items:center;gap:4px;width:116px;background:none;border:2px solid transparent;border-radius:14px;padding:8px 4px;text-align:center;font-size:.8125rem}
.creator .av{outline:3px solid transparent;outline-offset:3px}
.creator[aria-pressed=true] .av{outline-color:var(--sea-text)}
.creator[aria-pressed=false] .av{filter:grayscale(1)}
.creator .st{font-size:.75rem;font-weight:700;border-radius:999px;padding:1px 8px;border:1px solid var(--ghost-line)}
.creator[aria-pressed=true] .st{color:var(--sea-text);border-color:var(--sea-text)}
.creator[aria-pressed=false] .st{color:var(--muted)}

.footer{border-top:1px solid var(--line);margin-top:20px;padding:22px 28px;color:var(--muted);font-size:.8125rem;display:flex;gap:16px 30px;flex-wrap:wrap}
.footer p{margin:0;max-width:640px}
.footer b{color:var(--text)}
.footer ul{display:flex;gap:6px 16px;flex-wrap:wrap;list-style:none;margin:0;padding:0}

/* series */
.shead{padding:110px 28px 26px;margin-top:-68px}
.shead h1{font-size:2.5rem;margin:6px 0;letter-spacing:-.03em}
.meta{display:flex;gap:6px 14px;color:var(--muted);font-size:.8125rem;flex-wrap:wrap;align-items:center}
.povbar{display:flex;align-items:center;gap:12px;margin-top:18px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;flex-wrap:wrap}
.stack{display:flex}.stack .av{margin-left:-6px;border:2px solid var(--surface2);width:30px;height:30px}
.stack .av:first-child{margin-left:0}
.pill{font-size:.75rem;border-radius:999px;padding:2px 9px;border:1px solid var(--ghost-line);color:var(--text)}
.pill.sea{color:var(--sea-text);border-color:var(--sea-text)}
.pill.coral{color:var(--accent-text);border-color:var(--accent-text)}
.pill.warn{color:var(--sand);border-color:var(--sand)}
.subnav ul{display:flex;gap:4px;padding:0 28px;border-bottom:1px solid var(--line);list-style:none;margin:0;overflow-x:auto}
.subnav a{display:block;padding:12px 14px;text-decoration:none;color:var(--muted);font-size:.875rem;border-bottom:3px solid transparent;white-space:nowrap}
.subnav a[aria-current=page]{color:var(--text);border-color:var(--accent);font-weight:700}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:28px;padding:20px 28px}
.week{margin-bottom:22px}
.week h2,.week h3{font-size:.8125rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:0 0 10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tl{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;list-style:none;margin:0;padding:0}
.tl .ep{width:auto}
.side{display:flex;flex-direction:column;gap:14px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.box h2,.box h3{margin:0 0 8px;font-size:.9375rem}
.box p{margin:0 0 8px;color:var(--muted);font-size:.8125rem}
.toggle{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:8px 4px;text-align:left;font-size:.875rem;min-height:44px;border-radius:8px}
.toggle .lb{flex:1}
.toggle .lb small{display:block;color:var(--muted);font-size:.75rem}
.sw{width:42px;height:24px;border-radius:999px;background:var(--sw-off);position:relative;flex:0 0 auto;border:2px solid var(--sw-off)}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--bg);transition:.2s}
.toggle[aria-checked=true] .sw{background:var(--sw-on);border-color:var(--sw-on)}
.toggle[aria-checked=true] .sw::after{left:20px;background:var(--sw-knob)}
.toggle .st{width:2.2em;font-size:.75rem;font-weight:700;color:var(--muted)}
.bar{height:8px;border-radius:999px;background:var(--ghost);border:1px solid var(--ghost-line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--sea-text)}
.session{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.session.next{border:2px solid var(--accent-text)}
.session header{display:flex;align-items:center;gap:8px 10px;margin-bottom:12px;flex-wrap:wrap}
.session h2{font-size:1.0625rem;margin:0}
.session .tl{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}

/* player */
.player{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;padding:18px 28px}
.video{aspect-ratio:16/9;border-radius:14px;background:#000;color:#ccc;display:grid;place-items:center;position:relative;overflow:hidden;border:1px solid var(--line)}
.video .yt{display:flex;flex-direction:column;align-items:center;gap:10px}
.video .yt i{width:68px;height:48px;border-radius:12px;background:#f00;display:grid;place-items:center;font-style:normal;font-size:1.25rem;color:#fff}
.upnext{position:absolute;right:16px;bottom:16px;left:16px;max-width:460px;margin-left:auto;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.8125rem}
.upnext p{margin:0;flex:1 1 180px}
.queue ol{list-style:none;margin:0;padding:0}
.queue li a{display:flex;gap:10px;padding:8px;border-radius:10px;align-items:center;text-decoration:none}
.queue li a[aria-current=true]{background:var(--ghost);border:1px solid var(--accent-text)}
.queue .thumb{width:120px;flex:0 0 120px}
.queue .thumb .lbl{font-size:.875rem}
.vt h1{font-size:1.375rem;margin:14px 0 6px}
.kbd{font-family:ui-monospace,Menlo,monospace;border:1px solid var(--ghost-line);border-bottom-width:2px;border-radius:5px;padding:0 5px;font-size:.75rem}

/* prefs */
.grid-cr{display:grid;grid-template-columns:repeat(auto-fill,minmax(116px,1fr));gap:12px 6px;list-style:none;margin:0;padding:0}
.grp{font-size:.8125rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:22px 0 10px}
.override{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.override .nm{flex:1 1 200px}
.override .nm b{display:block}
.override .nm span{font-size:.8125rem;color:var(--muted)}
.override .seg{display:inline-grid;grid-template-columns:auto auto}
.chip-sw{width:46px;height:46px;border-radius:8px;background:var(--g);flex:0 0 auto}

/* forms */
.modal-wrap{position:relative;padding:28px;min-height:640px;background:var(--bg)}
.modal-wrap::before{content:"";position:absolute;inset:0;background:#000a}
.modal{position:relative;max-width:580px;margin:20px auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px}
.modal h2{margin:0 0 4px;font-size:1.25rem}
.field{margin:16px 0;border:0;padding:0}
.field>label,.field legend{display:block;font-size:.8125rem;font-weight:700;margin-bottom:6px;padding:0}
.field .hint{font-size:.75rem;color:var(--muted);margin:-2px 0 6px}
.field select,.field textarea,.field input[type=text]{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
.radios{display:flex;gap:8px;flex-wrap:wrap}
.radios label{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:.8125rem;cursor:pointer;min-height:40px}
.radios label:has(input:checked){border:2px solid var(--sea-text);font-weight:700}
.radios input{accent-color:var(--accent);margin:0}
.review{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;padding:22px 28px}
.ritem{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.ritem.creatorreq{border:2px solid var(--sand)}
.ritem h3{font-size:.9375rem;margin:8px 0 0}
.ritem .hd{display:flex;gap:8px 10px;align-items:center;font-size:.8125rem;color:var(--muted);flex-wrap:wrap}
.ritem .hd b{color:var(--text)}
.diff{margin:10px 0;font-family:ui-monospace,Menlo,monospace;font-size:.8125rem;background:var(--surface2);border-radius:10px;padding:10px 12px;border:1px solid var(--line)}
.diff p{margin:0}
.diff del{text-decoration:line-through}
.diff ins{text-decoration:none;font-weight:700}
.trust{display:flex;align-items:center;gap:8px;font-size:.75rem}
.trust .bar{width:100px}
.hist li{padding:8px 0;border-bottom:1px solid var(--line);font-size:.8125rem;color:var(--muted);display:flex;gap:10px;justify-content:space-between}
.hist li b{color:var(--text)}

<script>
const LOGO=`<svg class="logo-mark" viewBox="0 0 24 24" width="30" height="30" aria-hidden="true" focusable="false" shape-rendering="crispEdges"><rect x="3" y="8" width="18" height="8" fill="#2f8f8a"/><rect x="1" y="12" width="4" height="8" fill="#3fd0c9"/><rect x="19" y="12" width="4" height="8" fill="#3fd0c9"/><rect x="4" y="15" width="16" height="5" fill="#3fd0c9"/><rect x="3" y="20" width="2" height="2" fill="#1d5a57"/><rect x="19" y="20" width="2" height="2" fill="#1d5a57"/><rect x="4" y="7" width="3" height="3" fill="#ff7a59"/><rect x="17" y="7" width="3" height="3" fill="#ff7a59"/><rect x="6" y="10" width="2" height="2" fill="#ff7a59"/><rect x="16" y="10" width="2" height="2" fill="#ff7a59"/><rect x="7" y="10" width="10" height="6" fill="#ff7a59"/><rect x="8" y="9" width="8" height="2" fill="#ff9b80"/><rect x="9" y="6" width="1" height="3" fill="#ff7a59"/><rect x="14" y="6" width="1" height="3" fill="#ff7a59"/><rect x="8" y="3" width="3" height="3" fill="#fff"/><rect x="13" y="3" width="3" height="3" fill="#fff"/><rect x="9" y="4" width="1" height="1" fill="#111"/><rect x="14" y="4" width="1" height="1" fill="#111"/></svg>`;
/* ---------- data ---------- */
const C={GR:['Grian','#e05d5d','Grian'],MJ:['MumboJumbo','#ffd166','Mumbo'],SC:['GoodTimesWithScar','#7bd389','Scar'],TT:['TangoTek','#9ad0ff','TangoTek'],PL:['PearlescentMoon','#f78fb3','Pearl'],IM:['ImpulseSV','#ff9f43','Impulse'],LZ:['Lizzie','#c792ea','Lizzie'],ET:['EthosLab','#a0e7e5','Etho'],BD:['Bdubs','#b4f8c8','Bdubs'],ZD:['Zedaph','#fbe7c6','Zedaph'],GM:['Gem','#ffaebc','Gem'],XS:['Xisuma','#cdb4db','Xisuma'],CB:['Cubfan135','#bde0fe','Cub'],MT:['Martyn','#ffb4a2','Martyn'],JL:['Smallishbeans','#e5989b','Joel'],JS:['Solidarity','#d4a5b0','Jimmy'],SM:['Smajor','#90e0ef','Smajor']};

  pGreen:'linear-gradient(160deg,#3b8d5a,#0d2219)',pRed:'linear-gradient(160deg,#a33,#1e070b)',pGold:'linear-gradient(160deg,#e0a93b,#2a1b04)',pBlue:'linear-gradient(160deg,#2f6c99,#0a1724)',pPurple:'linear-gradient(160deg,#6d3f8f,#170b20)',pNavy:'linear-gradient(160deg,#465a9c,#0f1530)',pBrown:'linear-gradient(160deg,#a36b2f,#22140a)'};


/* ---------- poster art: own artwork per series, no text in the image ---------- */
const PAL={
 hc10:{name:'Hermitcraft Season 10',sky:['#8fd6ea','#e3f6cf'],sun:'#fff3b0',far:'#5aa564',near:'#2f6b3a',motif:'tree',acc:'#245a2c'},
 hc9:{name:'Hermitcraft Season 9',sky:['#2e2160','#c77fa3'],sun:'#ffe9c7',far:'#5a3d7a',near:'#24183a',motif:'tree',acc:'#1a1230',moon:1},
 secret:{name:'Secret Life',sky:['#22070e','#b03a46'],sun:'#ffd1d1',far:'#6b1d2a',near:'#2c0a12',motif:'heart',acc:'#ff6b7f',moon:1},
 limited:{name:'Limited Life',sky:['#0b1f3a','#5b92d0'],sun:'#e6f2ff',far:'#24507f',near:'#0d2644',motif:'hourglass',acc:'#ffd166'},
 double:{name:'Double Life',sky:['#33190a','#e0974f'],sun:'#fff0d6',far:'#7a4a1e',near:'#341d0a',motif:'hearts2',acc:'#ff6b6b'},
 empires:{name:'Empires SMP S2',sky:['#3f2700','#f3c85f'],sun:'#fff7da',far:'#a8741f',near:'#4f3306',motif:'crown',acc:'#ffe08a'},
 decked:{name:'Decked Out 2',sky:['#080c26','#3c4f9c'],sun:'#c9d4ff',far:'#2a3570',near:'#0f1638',motif:'card',acc:'#8ff0e0',moon:1},
 third:{name:'3rd Life',sky:['#0c3324','#62b984'],sun:'#f6ffe0',far:'#2f7a4f',near:'#123a26',motif:'hearts3',acc:'#ff5d73'},
 last:{name:'Last Life',sky:['#0f0a18','#5e3c72'],sun:'#e8d7ff',far:'#3b2650',near:'#170e22',motif:'heart',acc:'#c792ff',moon:1}
};
const PIX={heart:['.XX.XX.','XXXXXXX','XXXXXXX','.XXXXX.','..XXX..','...X...'],crown:['X..X..X','XX.X.XX','XXXXXXX','XXXXXXX','XXXXXXX'],hourglass:['XXXXXXX','.XXXXX.','..XXX..','...X...','..XXX..','.XXXXX.','XXXXXXX'],card:['XXXXX','X...X','X.X.X','X...X','X.X.X','X...X','XXXXX'],tree:['..XXX..','.XXXXX.','XXXXXXX','XXXXXXX','.XXXXX.','...X...','...X...']};
let ARTN=0;
function rnd(seed){let x=(seed*2654435761)%4294967296;return()=>{x=(x*1664525+1013904223)%4294967296;return x/4294967296}}
function pix(pat,x,y,u,col){let o='';pat.forEach((row,j)=>[...row].forEach((c,i)=>{if(c==='X')o+=`<rect x="${(x+i*u).toFixed(1)}" y="${(y+j*u).toFixed(1)}" width="${(u+.3).toFixed(1)}" height="${(u+.3).toFixed(1)}" fill="${col}"/>`}));return o}
function hill(W,H,base,amp,bw,r,col){let d=`M0 ${H}`;for(let x=0;x<W+bw;x+=bw){const y=(H*base-r()*H*amp).toFixed(1);d+=` L${x} ${y} L${x+bw} ${y}`}return `<path d="${d} L${W} ${H} Z" fill="${col}"/>`}
function art(k,seed=1,W=100,H=150,tint){
  const p=PAL[k]||PAL.hc10,r=rnd(seed*7+k.length),id='a'+(ARTN++),m=Math.min(W,H),wide=W>H;
  let g=`<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${p.sky[0]}"/><stop offset="1" stop-color="${p.sky[1]}"/></linearGradient></defs><rect width="${W}" height="${H}" fill="url(#${id})"/>`;
  const sx=W*(wide?.55+r()*.3:.25+r()*.5),sy=H*(.16+r()*.1),sr=m*.13,sun=tint||p.sun;
  if(p.moon){for(let i=0;i<14;i++)g+=`<rect x="${(r()*W).toFixed(1)}" y="${(r()*H*.45).toFixed(1)}" width="${(m*.012).toFixed(2)}" height="${(m*.012).toFixed(2)}" fill="#fff" opacity=".8"/>`;
    g+=`<circle cx="${sx}" cy="${sy}" r="${sr}" fill="${sun}"/><circle cx="${sx+sr*.45}" cy="${sy-sr*.2}" r="${sr*.85}" fill="${p.sky[0]}"/>`}
  else g+=`<rect x="${sx-sr}" y="${sy-sr}" width="${sr*2}" height="${sr*2}" fill="${sun}" opacity=".95"/>`;
  g+=hill(W,H,.66,.12,W/14,r,p.far);
  const u=m*(wide?.045:.06),pat=PIX[p.motif==='hearts2'||p.motif==='hearts3'?'heart':p.motif];
  const n=p.motif==='hearts2'?2:p.motif==='hearts3'?3:1,pw=pat[0].length*u,gap=u*1.5,tot=n*pw+(n-1)*gap;
  let mx=wide?W*.72-tot/2:W/2-tot/2,my=H*(wide?.2:.3);
  if(p.motif==='tree'){for(let t=0;t<5;t++){const tu=u*(.5+r()*.5),tx=wide?W*(.4+r()*.58):r()*W,ty=H*(.6+r()*.08);g+=pix(pat,tx,ty-pat.length*tu,tu,p.acc)}}
  else for(let i=0;i<n;i++)g+=pix(pat,mx+i*(pw+gap),my,u,p.acc);
  g+=hill(W,H,.82,.1,W/10,r,p.near);

let CUR='hc10',SEED=1;

const NAV=['Home','Series','Creators','Who I watch','Community'];

S.concept=['0 · Concept',()=>`<div class="app concept" style="max-width:1000px;padding:36px 40px">
<main id="concept-main">
<div class="logo" style="font-size:1.75rem">${LOGO}Couchcrab <span class="unofficial">unofficial fan project</span></div>
<p style="color:var(--muted);max-width:720px">A Netflix-style way to binge Minecraft YouTube series from the Hermitcraft community and friends. Every video plays from YouTube itself, so views and ad revenue stay with the creator.</p>
<h1 class="sr-only">Couchcrab concept</h1>
<h2 style="font-size:1.125rem;margin-top:28px">What we decided</h2>
<table><tbody>
<tr><th scope="row">Data</th><td>YouTube Data API pulls creator channels and playlists. Title rules place videos in a series and season. The community corrects whatever lands in the wrong spot.</td></tr>
<tr><th scope="row">Community</th><td>Signed-in users suggest edits, trusted editors approve them, trust grows with each approved suggestion. Full history, everything can be reverted.</td></tr>
<tr><th scope="row">Accounts</th><td>Optional, Discord login only. Watching, preferences and display settings work without an account (stored in the browser).</td></tr>
<tr><th scope="row">Who I watch</th><td>One global creator list, each series can follow it or override it. Inside a series you watch your chosen POVs mixed on one timeline.</td></tr>
<tr><th scope="row">Timeline</th><td>Upload date by default. Live series are grouped into sessions by the community.</td></tr>
<tr><th scope="row">Content</th><td>Episodes and second channels in the main series. Livestream VODs in an "Extras" side series. No Shorts.</td></tr>
<tr><th scope="row">Spoilers</th><td>Spoiler-free mode per series: unwatched episodes get a neutral card and a plain "Episode 12" title.</td></tr>
<tr><th scope="row">Playback</th><td>Embedded YouTube player. Autoplay of the next episode is a setting with a visible countdown that can be paused, cancelled or set to "wait for me".</td></tr>
<tr><th scope="row">Editors</th><td>At launch only the owner approves suggestions. Trusted editors come later.</td></tr>
<tr><th scope="row">Creators</th><td>One list without fixed groups. Creators, channels, series, title rules and site texts are all managed in the tool, nothing is hard-coded.</td></tr>
<tr><th scope="row">Creator requests</th><td>Own form for corrections or removal, always on top of the review queue.</td></tr>
<tr><th scope="row">Posters</th><td>Every series has its own poster: an illustration without text in it. The title is real text on top, so it scales, follows the theme and gets read out.</td></tr>
<tr><th scope="row">Not affiliated</th><td>Banner on first visit, line in every footer, "Unofficial" label next to the logo, About page.</td></tr>
</tbody></table>

<h2 style="font-size:1.125rem;margin-top:28px">Accessibility (new in v2)</h2>
<table><tbody>
<tr><th scope="row">Target</th><td>WCAG 2.2 level AA on every screen, in every theme. Measured each release with axe, keyboard-only runs, 200% zoom, 320 px reflow and reduced motion. Screen reader runs (NVDA, VoiceOver) are done by people: a test group of fans after launch.</td></tr>
<tr><th scope="row">Captions first</th><td>Each episode shows a <span class="cc">CC</span> badge when the creator uploaded real captions (not only YouTube's auto captions, which struggle with Minecraft words and names). Filter: "only episodes with creator captions". Captions can be switched on by default in the player.</td></tr>
<tr><th scope="row">Display</th><td>Theme in the account menu: System, Dark, Light, High contrast. Text size (default, large, larger), reduced motion (follows the system), underlined links, and a text-only list view without thumbnails.</td></tr>
<tr><th scope="row">No surprises</th><td>Nothing moves or plays on its own without a setting. Autoplay countdown is announced once to screen readers and pauses on hover or focus. No carousels that rotate by themselves.</td></tr>
<tr><th scope="row">Keyboard</th><td>Skip link, visible focus everywhere, every rail scrollable with buttons and Tab. Single-key shortcuts can be turned off or changed (WCAG 2.1.4).</td></tr>
<tr><th scope="row">Not colour alone</th><td>Selected creators show "✓ Watching", watched episodes "✓ Watched", progress as "62% watched", not just a colour, opacity or bar.</td></tr>
<tr><th scope="row">Spoilers and screen readers</th><td>The hidden title is also hidden from screen readers. Thumbnails are decorative (the title is right next to them), so YouTube thumbnails with text in them don't need to be read out.</td></tr>
<tr><th scope="row">Limits we say out loud</th><td>The YouTube player itself and the quality of the videos and captions belong to YouTube and the creators. The accessibility statement says so and points to "Report an accessibility problem".</td></tr>
</tbody></table>

<h2 style="font-size:1.125rem;margin-top:28px">Name</h2>
<p><b>Couchcrab</b>: a hermit crab on the couch, bingeing. A wink to fans without using any Hermitcraft or Minecraft name. couchcrab.com was free on 21 Nov 2026 (checked with the .com registry).</p>

<h2 style="font-size:1.125rem;margin-top:28px">Later</h2>
<ol style="font-size:.875rem;padding-left:18px">
<li>After launch: a test group of fans who use a screen reader, captions or only a keyboard.</li>
<li>Domain and hosting for the public version (after dev.lan).</li>
</ol>
</main></div>`];

/* ---------- render board ---------- */
const btnWrap=document.getElementById('screen-buttons'),wrap=document.getElementById('screens');
Object.entries(S).forEach(([k,[label,fn]],i)=>{
  btnWrap.insertAdjacentHTML('beforeend',`<li><button type="button" data-s="${k}" aria-pressed="${i===0}">${label}</button></li>`);
  wrap.insertAdjacentHTML('beforeend',`<div class="screen" id="${k}"${i===0?'':' hidden'}>${fn()}</div>`);
});
function show(k){
  document.querySelectorAll('[data-s]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.s===k));
  document.querySelectorAll('.screen').forEach(s=>s.hidden=s.id!==k);
  scrollTo(0,0);
}
btnWrap.addEventListener('click',e=>{const b=e.target.closest('[data-s]');if(b)show(b.dataset.s)});
if(location.hash&&S[location.hash.slice(1)])show(location.hash.slice(1));
document.querySelectorAll('input[name=board-theme]').forEach(r=>r.addEventListener('change',()=>document.body.dataset.theme=r.value));
document.addEventListener('click',e=>{
  const t=e.target.closest('.toggle');if(t){const on=t.getAttribute('aria-checked')!=='true';t.setAttribute('aria-checked',on);t.querySelector('.st').textContent=on?'On':'Off';}
  const c=e.target.closest('button.creator');if(c){const on=c.getAttribute('aria-pressed')!=='true';c.setAttribute('aria-pressed',on);c.querySelector('.st').textContent=on?'✓ Watching':'+ Add';}
  const s=e.target.closest('[data-scroll]');if(s){const r=document.getElementById(s.dataset.scroll);r.scrollBy({left:s.dataset.dir*r.clientWidth*.8,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});}
});
</script>
